name: Home Assistant validation

# hassfest checks the manifest, translations and config flow against Home Assistant's rules;
# the HACS action checks the repository layout, hacs.json and the repository metadata
# (description, topics). Only runs when the integration or this workflow changes.
on:
  push:
    branches: [main]
    paths: ['custom_components/**', 'hacs.json', '.github/workflows/ha-validate.yml']
  pull_request:
    paths: ['custom_components/**', 'hacs.json', '.github/workflows/ha-validate.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # brands are only needed for the default HACS list, not for a custom repository
          ignore: brands
