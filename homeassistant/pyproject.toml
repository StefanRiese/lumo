[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# the integration lives at the repository root (HACS needs custom_components/ there)
pythonpath = [".."]

[tool.ruff]
line-length = 100
target-version = "py313"
src = [".."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC109", "ASYNC110"]
